# Deploys the site to GitHub Pages on every push to main, stamping the commit id
# into version.json and engine/version.js so open pages can offer "Update".
# One-time setup: Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stamp the build id
        run: |
          BUILD="${GITHUB_SHA::7}"
          printf '{"build":"%s","at":"%s"}\n' "$BUILD" "$(date -u +%FT%TZ)" > version.json
          printf "export const BUILD = '%s';\n" "$BUILD" > engine/version.js

      - name: Leave out test tooling
        run: rm -rf tests playwright.config.js package.json package-lock.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
